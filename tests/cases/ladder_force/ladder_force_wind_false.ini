; Finite-difference test of the exterior spring forces of the exchange classes (free bosons, PBC)

[simulation]
dt = 1.0 femtosecond
steps = 10
sfreq = 10
threshold = 0.0
nbeads = 4
fixcom = false
bosonic = true
seed = 777
pbc = true
winding_springs = false
max_wind = 2
initial_position = random
initial_velocity = random
thermostat = langevin

[system]
temperature = 1.0 kelvin
natoms = 12
size = 8.0 angstrom
mass = 4.0026 dalton

[interaction_potential]
name = free

[external_potential]
name = free

[output]

[observables]
energy = kelvin
